name: Release

# Every push to main builds both installers. Only a v* tag publishes a release
on:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  mac:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - name: Check the release config has no placeholders
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          if grep -n REPLACE_ME src/shared/config.ts; then
            echo '::error file=src/shared/config.ts::Fill in every REPLACE_ME before releasing'
            exit 1
          fi
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Restore the whisper model
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: native/whisper/models
          key: whisper-model-ggml-base-60ed5bc3
      - name: Restore native helpers
        id: native
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: native/bin
          key: native-${{ runner.os }}-${{ hashFiles('native/build.mjs', 'native/whisper/build.mjs', 'native/ffmpeg/build.mjs', 'native/mac-capture/**') }}
      - name: Install build tools
        if: steps.native.outputs.cache-hit != 'true'
        run: brew install pkgconf cmake
      - name: Build native helpers
        if: steps.native.outputs.cache-hit != 'true'
        run: npm run build:native
      # electron-builder only warns when an extraResources folder is missing
      - name: Check native helpers exist
        run: |
          cd native/bin/darwin-arm64
          test -x dolly-capture
          test -x ffmpeg
          test -x whisper-cli
          test -s models/ggml-base.bin
      - run: npm run build
      - run: npx electron-builder --mac --publish never
      - name: Check the packaged app
        run: |
          app=release/mac-arm64/Dolly.app
          codesign --verify --deep --strict "$app"
          codesign --display --verbose "$app" 2>&1 | grep -q 'flags=.*runtime'
          fuses=$(npx electron-fuses read --app "$app")
          for fuse in RunAsNode EnableNodeOptionsEnvironmentVariable EnableNodeCliInspectArguments; do
            grep -q "$fuse is Disabled" <<< "$fuses"
          done
          for fuse in EnableEmbeddedAsarIntegrityValidation OnlyLoadAppFromAsar; do
            grep -q "$fuse is Enabled" <<< "$fuses"
          done
          test -x "$app/Contents/Resources/bin/dolly-capture"
          test -x "$app/Contents/Resources/bin/whisper-cli"
          test -x "$app/Contents/Resources/bin/ffmpeg"
          test ! -e "$app/Contents/Resources/app.asar.unpacked/node_modules/ffmpeg-static/ffmpeg"
          test ! -e "$app/Contents/Resources/app.asar.unpacked/node_modules/uiohook-napi"
          if ./node_modules/.bin/asar list "$app/Contents/Resources/app.asar" | grep -q 'node_modules/uiohook-napi'; then
            echo '::error::uiohook-napi is in the macOS app.asar'
            exit 1
          fi
          if "$app/Contents/Resources/bin/ffmpeg" -hide_banner -L 2>&1 | grep -qi nonfree; then
            echo '::error::The bundled ffmpeg is a nonfree build'
            exit 1
          fi
      - name: Scan the packaged app for secrets
        run: |
          resources=release/mac-arm64/Dolly.app/Contents/Resources
          ./node_modules/.bin/asar extract "$resources/app.asar" "$RUNNER_TEMP/app-asar"
          DOLLY_SCAN_PATH="$RUNNER_TEMP/app-asar" npx vitest run tests/license-secrets.test.ts
          DOLLY_SCAN_PATH="$resources" npx vitest run tests/license-secrets.test.ts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dolly-mac
          path: release/Dolly-*-mac-arm64.dmg
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - name: Check the release config has no placeholders
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          if grep -n REPLACE_ME src/shared/config.ts; then
            echo '::error file=src/shared/config.ts::Fill in every REPLACE_ME before releasing'
            exit 1
          fi
      - run: npm ci
      # ffmpeg-static b6.1.1, ffmpeg-win32-x64.gz from its GitHub release, hashed after gunzip. Update with the package
      - name: Check the ffmpeg binary
        run: echo '04e1307997530f9cf2fe35cba2ca7e8875ca91da02f89d6c7243df819c94ad00  node_modules/ffmpeg-static/ffmpeg.exe' | sha256sum --check --strict
      - run: npm run typecheck
      # Temporary while Windows comes up: failures are listed on the run page and the build carries on
      - name: Run tests
        continue-on-error: true
        run: npx vitest run --reporter=default --reporter=json --outputFile=vitest.json
      - name: List test failures
        if: always()
        run: |
          node -e '
            const r = JSON.parse(require("fs").readFileSync("vitest.json", "utf8"))
            const lines = [r.numPassedTests + " passed, " + r.numFailedTests + " failed"]
            for (const f of r.testResults) for (const a of f.assertionResults) {
              if (a.status === "failed") lines.push(f.name.split(/[\\/]/).pop() + " > " + a.fullName + " :: " + String(a.failureMessages[0]).split("\n")[0].slice(0, 120))
            }
            console.log("::warning title=Windows tests::" + lines.join("%0A"))'
      - name: Restore the whisper model
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: native/whisper/models
          key: whisper-model-ggml-base-60ed5bc3
      - name: Restore native helpers
        id: native
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: native/bin
          key: native-${{ runner.os }}-${{ hashFiles('native/build.mjs', 'native/whisper/build.mjs', 'native/win-capture/**') }}
      - name: Build native helpers
        if: steps.native.outputs.cache-hit != 'true'
        run: npm run build:native
      - name: Check native helpers exist
        run: |
          cd native/bin/win32-x64
          test -f dolly-capture.exe
          test -f whisper-cli.exe
          test -s models/ggml-base.bin
      - run: npm run build
      - run: npx electron-builder --win --publish never
      - name: Check the packaged app
        run: |
          app=release/win-unpacked
          test -f "$app/resources/bin/dolly-capture.exe"
          test -f "$app/resources/bin/whisper-cli.exe"
          test -f "$app/resources/app.asar.unpacked/node_modules/ffmpeg-static/ffmpeg.exe"
          test -f "$app/resources/app.asar.unpacked/node_modules/uiohook-napi/prebuilds/win32-x64/uiohook-napi.node"
          fuses=$(npx electron-fuses read --app "$app/Dolly.exe")
          for fuse in RunAsNode EnableNodeOptionsEnvironmentVariable EnableNodeCliInspectArguments; do
            grep -q "$fuse is Disabled" <<< "$fuses"
          done
          for fuse in EnableEmbeddedAsarIntegrityValidation OnlyLoadAppFromAsar; do
            grep -q "$fuse is Enabled" <<< "$fuses"
          done
      - name: Scan the packaged app for secrets
        run: |
          resources=release/win-unpacked/resources
          ./node_modules/.bin/asar extract "$resources/app.asar" "$RUNNER_TEMP/app-asar"
          DOLLY_SCAN_PATH="$RUNNER_TEMP/app-asar" npx vitest run tests/license-secrets.test.ts
          DOLLY_SCAN_PATH="$resources" npx vitest run tests/license-secrets.test.ts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dolly-windows
          path: release/Dolly-*-win-x64.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  # Runs only when both installers built, so a failure never publishes half a release
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [mac, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: installers
          merge-multiple: true
      - name: Attach installers to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l installers
          test -n "$(ls installers/*.dmg)"
          test -n "$(ls installers/*.exe)"
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" installers/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" installers/* --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
          fi
